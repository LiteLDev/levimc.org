name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # LeviMC Mods (/mods/) is a snapshot of its repositories' tags (mods/repos.txt), so rebuild to pick up new
  # versions.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      kit-changed: ${{ steps.kit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # levimc-kit lives here (kit/) and is published with the site at https://levimc.org/kit/v2/, where every
      # other LeviMC site fetches it when it builds. --stamp puts the kit's build hash into this site's pages too.
      - id: kit
        run: |
          node kit/scripts/publish-kit.mjs .kit/publish --stamp
          new=$(jq -r .build .kit/publish/v2/manifest.json)
          old=$(curl -fsSL https://levimc.org/kit/v2/manifest.json | jq -r .build || echo none)
          echo "kit build: $old → $new"
          echo "changed=$([ "$new" != "$old" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - run: npm run typecheck

      # Blog content (Hexo permalinks, slugs, rendering) and the kit's preference tests.
      - run: npm test

      # Client build, SSR build and prerender: one static HTML file per route
      # (projects/index.html, …) plus 404.html, sitemap.xml and robots.txt.
      - run: npm run build

      - run: cp -r .kit/publish dist/kit

      # LeviMC Mods: its own app in mods/ (pnpm), built with this kit and deployed at /mods/. The token lets its build
      # read each package repository from GitHub's GraphQL API (renamed repositories, stars, release dates, license).
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: mods/package.json

      # What earlier builds read from the mods' repositories (mods/.cache, see mods/src/server/registry.ts), so this one
      # reads only new tags. Without it, everything is read again (about a minute).
      - uses: actions/cache/restore@v6
        with:
          path: mods/.cache
          key: mods-registry-${{ github.run_id }}
          restore-keys: mods-registry-

      - working-directory: mods
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Saved only when it changed (the key is its hash).
      - uses: actions/cache/save@v6
        with:
          path: mods/.cache
          key: mods-registry-${{ hashFiles('mods/.cache/registry.json') }}

      - run: cp -r mods/dist dist/mods

      # Internal links, redirect-needing links and #anchors (GitHub Pages semantics).
      - run: npm run linkcheck

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # A new kit is live: rebuild every other LeviMC site now, so the change reaches them within minutes. Needs the
  # KIT_SYNC_TOKEN secret (a fine-grained token with "Actions: read and write" on the repositories below);
  # without it, each site still picks the new kit up with its hourly check.
  sync:
    needs: [build, deploy]
    if: needs.build.outputs.kit-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.KIT_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::KIT_SYNC_TOKEN is not set: the sites rebuild with the new kit at their next hourly check"
            exit 0
          fi
          status=0
          while read -r repo workflow; do
            echo "→ $repo ($workflow)"
            gh workflow run "$workflow" -R "LiteLDev/$repo" || status=1
          done <<'EOF'
          liteldev.github.io deploy.yml
          LeviLamina build-docs.yml
          LegacyScriptEngine build_docs.yml
          lip build-docs.yml
          LeviLauncher docs.yml
          BeDD docs.yml
          EOF
          exit $status
