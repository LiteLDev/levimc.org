# /api/v4/versions/: adds the release Mojang's download API names now to versions/versions.json (see
# versions/update.mjs), commits it and starts a deploy. A push made with the workflow token starts no workflows, so
# the deploy is started by hand (workflow_dispatch is the exception); the hourly deploy would pick it up anyway.
name: Versions

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: update
        run: |
          added=$(node versions/update.mjs)
          echo "$added"
          if git diff --quiet -- versions/versions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions/versions.json
          git commit -q -m "versions: add $(echo "$added" | awk '{print $2}' | sort -u | paste -sd, -)" -m "$added"
          # main may have moved since the checkout
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
          git diff --quiet origin/main -- versions/versions.json
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref main
