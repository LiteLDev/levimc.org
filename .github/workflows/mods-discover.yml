# LeviMC Mods: finds mod repositories mods/repos.txt does not name yet and opens a pull request for each (see
# mods/scripts/discover.mjs). Merging one lists the repository at the next deploy; closing one keeps it out for good.
# Needs "Allow GitHub Actions to create and approve pull requests" (Settings → Actions → General). Pull requests the
# workflow token opens start no workflows of their own.
name: LeviMC Mods discovery

on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what it would propose
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mods-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: node scripts/discover.mjs ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional: a personal token (no scopes needed, public code search only). The workflow token's code search
          # limit is shared beyond this workflow and often answers the first request with HTTP 429.
          SEARCH_TOKEN: ${{ secrets.MODS_SEARCH_TOKEN }}
